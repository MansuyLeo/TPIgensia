<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | CV Portfolio</title>
  <link rel="icon" href="img/favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <!-- Page contact du site CV/portfolio -->
  <header>
    <button id="theme-toggle" aria-label="Changer de thème">🌙 Thème</button>
    <h1>Contact</h1>
  </header>

  <nav id="site-nav" aria-label="Navigation principale"></nav>

  <main>
    <section>
      <h2 style="text-align:center;">Demande de contact</h2>
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Nom complet *</label>
          <input type="text" id="name" name="name" required placeholder="Votre nom">
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required placeholder="votre.email@exemple.com">
        </div>

        <div class="form-group full-width">
          <label for="subject">Sujet *</label>
          <select id="subject" name="subject" required>
            <option value="">-- Sélectionner un sujet --</option>
            <option value="question">Question général</option>
            <option value="collaboration">Collaboration</option>
            <option value="feedback">Feedback</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="message">Message *</label>
          <textarea id="message" name="message" required placeholder="Votre message..."></textarea>
        </div>

        <div class="form-group full-width">
          <label for="priority">Priorité</label>
          <select id="priority" name="priority">
            <option value="normal" selected>Normal</option>
            <option value="urgent">Urgent</option>
            <option value="faible">Faible</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>
            <input type="checkbox" name="newsletter" id="newsletter">
            M'inscrire à la newsletter
          </label>
        </div>

        <button type="submit">Envoyer</button>
      </form>
    </section>
    <p><a href="#top" class="jump">Retour en haut</a></p>
  </main>

  <footer id="site-footer"></footer>
  <script src="include.js"></script>
</body>
</html>
